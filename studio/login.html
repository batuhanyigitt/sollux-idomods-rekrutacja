<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SOLLUX Studio · Logowanie</title><style>
@import url("https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300..900&display=swap");*{box-sizing:border-box}body{background:radial-gradient(circle at 70% 5%,#2f3f2b,#101417 55%);height:100vh;margin:0;color:#f4f8f4;display:grid;place-items:center;font-family:'Red Hat Display',system-ui}.login{background:#171e21;border:1px solid #405040;border-radius:18px;width:min(420px,calc(100vw - 28px));padding:38px;box-shadow:0 25px 75px #0006}.eyebrow{color:#c7fc70;letter-spacing:.16em;font-size:11px;font-weight:800}.mark{background:#26392a;color:#c7fc70;display:grid;place-items:center;border:1px solid #47653c;width:54px;height:54px;border-radius:12px;font-size:25px;font-weight:900}h1{font-size:32px;margin:18px 0 8px}p{font-size:14px;line-height:1.6;color:#a2b0a8;margin:0 0 30px}label{font-size:12px;font-weight:700;display:block;margin-bottom:9px}input{height:49px;width:100%;border:1px solid #435248;background:#0d1516;border-radius:8px;padding:0 13px;color:white;font:inherit;margin-bottom:18px}button{background:#c7fc70;border:0;border-radius:8px;color:#1a2612;font-weight:800;padding:14px 18px;width:100%;cursor:pointer;font:inherit}button:disabled{opacity:.6}#error{color:#ffb2a9;min-height:21px;margin:14px 0 0;font-size:12px}.foot{font-size:11px;color:#82938a;text-align:center;margin-top:22px}</style></head><body>
<main class="login"><div class="mark">S✳</div><div style="margin-top:28px" class="eyebrow">SOLLUX / CONTENT MANAGEMENT</div><h1>Witaj w Studio.</h1><p>Edytuj strony, bloki, obrazy i kolory. Pracuj na szkicu, a później opublikuj.</p><form id="form"><label for="user">Nazwa użytkownika</label><input id="user" type="text" autocomplete="username" value="admin" required placeholder="Nazwa użytkownika"><label for="pwd">Hasło administratora</label><input id="pwd" type="password" autocomplete="current-password" required placeholder="Wprowadź hasło"><button id="submit" type="submit">Zaloguj się do panelu →</button><div id="error" role="alert"></div></form><div class="foot">Panel CMS · Bezpieczne publikowanie · SOLLUX</div></main>
<script>const api='/.netlify/functions/cms';fetch(api+'?action=status',{credentials:'same-origin'}).then(r=>{if(r.ok)location.replace('/studio/')});document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#submit');btn.disabled=true;document.querySelector('#error').textContent='';try{const r=await fetch(api+'?action=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.querySelector('#user').value.trim(),password:document.querySelector('#pwd').value})});if(!r.ok)throw Error(r.status===503?'Konfiguracja CMS jest niekompletna.':'Nieprawidłowa nazwa użytkownika lub hasło.');location.replace('/studio/');}catch(err){document.querySelector('#error').textContent=err.message;btn.disabled=false;}});</script>
</body></html>
